; Several assets (SC_SFX/SC_Music/MIX_SFXVolume/MIX_MusicVolume, MP_TitleVideo/MS_TitleVideo/
; MT_TitleVideo, T_AdjustmentMenu, DMC_Music, and every imported SFX SoundWave) are loaded at
; runtime via LoadObject(hardcoded path) rather than a UPROPERTY reference, so the cooker's
; reference-following can't discover them on its own. Forcing /Game/Audio and /Game/UI to always
; cook guarantees they ship regardless of reachability through the normal asset reference graph.
; L_ControllerTestRange (the real gameplay map) is only ever opened via a hardcoded FName string
; (AAdjustmentMenuGameMode::FinishToGameplay, AGameplayPlayerController::RequestQuitToTitle), not a
; TSoftObjectPtr the cooker's reference-following can discover -- explicitly listing it (and
; L_TitleScreen, already covered by GameDefaultMap but harmless to list too) guarantees both ship
; regardless of reference-graph reachability.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/UI")
+MapsToCook=(FilePath="/Game/L_ControllerTestRange")
+MapsToCook=(FilePath="/Game/Maps/L_TitleScreen")
