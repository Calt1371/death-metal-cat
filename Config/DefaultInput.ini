[/Script/RawInput.RawInputSettings]
; PS4 DualShock 4 (v1 hardware -- USB Product ID 0x05C4; the later revision uses 0x09CC instead,
; not configured here since only the v1 ID was asked for). Axis order 1-8 mirrors the DS4's own HID
; report order: 1=RStick V, 2=RStick H, 3=LStick V, 4=LStick H, 5=DPad V, 6=DPad H, 7=R2, 8=L2 --
; see GameplayPlayerController or a future controls doc for the full button table. Axis 7/8 (the
; analog triggers) get Inverted+Offset=0.5: DS4 triggers report the same raw axis range as the
; sticks, and this is the standard correction so a released trigger reads as the bottom of the
; range instead of sitting at the sticks' centered rest value -- verified against a known-working
; UE5 DS4 reference config (github.com/DarknessFX/DualShock4-For-Unreal-Engine-5), which was NOT
; itself applying Inverted/Offset to any axis; that specific pairing was carried over from the
; instructions given for this setup, not independently re-derived, so revisit if trigger behavior
; reads wrong once tested.
+DeviceConfigurations=(VendorID="0x054C",ProductID="0x05C4",AxisProperties=((Key=GenericUSBController_Axis1),(Key=GenericUSBController_Axis2),(Key=GenericUSBController_Axis3),(Key=GenericUSBController_Axis4),(Key=GenericUSBController_Axis5),(Key=GenericUSBController_Axis6),(Key=GenericUSBController_Axis7,bInverted=True,Offset=0.5),(Key=GenericUSBController_Axis8,bInverted=True,Offset=0.5)),ButtonProperties=((Key=GenericUSBController_Button1),(Key=GenericUSBController_Button2),(Key=GenericUSBController_Button3),(Key=GenericUSBController_Button4),(Key=GenericUSBController_Button5),(Key=GenericUSBController_Button6),(Key=GenericUSBController_Button7),(Key=GenericUSBController_Button8),(Key=GenericUSBController_Button9),(Key=GenericUSBController_Button10),(Key=GenericUSBController_Button11),(Key=GenericUSBController_Button12),(Key=GenericUSBController_Button13),(Key=GenericUSBController_Button14)))
